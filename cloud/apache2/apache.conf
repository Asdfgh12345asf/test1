ServerName localhost

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule dir_module modules/mod_dir.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule alias_module modules/mod_alias.so
LoadModule autoindex_module modules/mod_autoindex.so

# Set user and group for Apache processes
User www-data
Group www-data

# Configure logging to stdout/stderr for containers
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# Ensure Apache listens on port 80
Listen 80

<VirtualHost *:80>
    ServerName stayease.local
    ServerAdmin webmaster@localhost
    DocumentRoot /usr/local/apache2/htdocs

    AddType image/svg+xml .svg
    AddType image/svg+xml .svgz

    <Directory /usr/local/apache2/htdocs>
        Require all granted
        AllowOverride None
        Options -Indexes +FollowSymLinks
    </Directory>

    Alias /code "/usr/local/apache2/code"
    <Directory "/usr/local/apache2/code">
        AllowOverride None
        Require all granted
        Options +Indexes +MultiViews
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyVia On

    # API endpoints proxy
    ProxyPass /api http://dashboard:8000/api
    ProxyPassReverse /api http://dashboard:8000/api
</VirtualHost>
